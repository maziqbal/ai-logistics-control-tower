name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Quality checks and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: logistics
          POSTGRES_PASSWORD: logistics_ci_password
          POSTGRES_DB: logistics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logistics -d logistics_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://logistics:logistics_ci_password@localhost:5432/logistics_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Apply test database migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm --filter api exec drizzle-kit migrate

      - name: Unit and database integration tests
        run: pnpm --filter api test --runInBand --ci

      - name: E2E tests
        run: pnpm --filter api test:e2e --runInBand --ci
