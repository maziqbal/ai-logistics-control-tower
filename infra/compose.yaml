services:
  db:
    image: postgis/postgis:17-3.5
    container_name: logistics-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: logistics_db

    ports:
      - '127.0.0.1:5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logistics -d logistics_db']
      interval: 5s
      timeout: 3s
      retries: 10

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: logistics-osrm
    restart: unless-stopped

    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/helsinki-region.osrm

    ports:
      - '127.0.0.1:5000:5000'

    volumes:
      - ./osrm/data/helsinki:/data:ro

volumes:
  postgres_data: